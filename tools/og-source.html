<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
  /* 카카오톡·인스타그램 링크 미리보기용 1200×630 원본.
     이 파일은 assets/og.png 를 뽑기 위한 것이며 사이트에서 쓰이지 않는다. */
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; gap: 64px;
    padding: 0 96px;
    background:
      radial-gradient(90% 120% at 88% -10%, rgba(255,90,95,.55) 0%, transparent 58%),
      linear-gradient(158deg, #DB0106 0%, #7C0510 100%);
    color: #FFF7F7;
    font-family: "IBM Plex Sans KR", sans-serif;
  }
  img { width: 208px; height: 208px; border-radius: 54px; background: #FFF7F7; padding: 12px; flex: none; }
  .copy { display: flex; flex-direction: column; gap: 18px; }
  .word { font-family: Fraunces, serif; font-weight: 600; font-size: 88px; line-height: .92; letter-spacing: -.02em; }
  .eng { font-size: 20px; font-weight: 500; letter-spacing: .44em; color: #F4BFC0; }
  .campus { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 42px; margin-top: 6px; }
  .claim { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 27px; margin-top: 14px; }
  .claim em { font-family: Fraunces, serif; font-style: italic; font-weight: 500; }
  .sub { font-size: 20px; font-weight: 300; color: #F4BFC0; }
</style>
</head>
<body>
  <img src="../assets/logo.png" alt="">
  <div class="copy">
    <div>
      <div class="word">Beyond</div>
      <div class="eng">ENGLISH</div>
      <div class="campus">사송캠퍼스</div>
    </div>
    <div>
      <div class="claim">결과가 다른 영어 · <em>Learn Beyond.</em></div>
      <div class="sub">Phonics부터 수능까지 이어지는 영어 성장 로드맵</div>
    </div>
  </div>
</body>
</html>
