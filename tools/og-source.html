<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og source</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
  /* 카카오톡·인스타그램 링크 미리보기용 1200×630 원본.
     이 파일은 assets/og.png 를 뽑기 위한 것이며 사이트에서 쓰이지 않는다.

     사이트와 같은 얼굴이어야 한다 — 연분홍 바탕에 흰 카드, 실제 워드마크. */
  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1200px; height: 630px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #FDF2F3;
    font-family: "IBM Plex Sans KR", sans-serif;
    color: #1A1213;
  }

  .card {
    width: 1010px; height: 470px;
    background: #FFFFFF;
    border-radius: 44px;
    box-shadow: 0 2px 4px rgba(26,18,19,.04), 0 40px 90px -50px rgba(219,1,6,.35);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    text-align: center;
  }

  img { width: 560px; height: auto; display: block; }

  .campus {
    font-family: "Gowun Batang", serif;
    font-weight: 700; font-size: 48px;
    letter-spacing: -.02em;
    margin-top: 6px;
  }

  .claim {
    font-size: 27px; font-weight: 600;
    color: #C00105; letter-spacing: -.01em;
  }
  .claim em { font-family: Fraunces, serif; font-style: italic; font-weight: 500; }

  .sub { font-size: 21px; font-weight: 300; color: #8A7476; }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/wordmark.png" alt="">
    <div class="campus">사송캠퍼스</div>
    <div>
      <div class="claim">결과가 다른 영어 · <em>Learn Beyond.</em></div>
      <div class="sub">Phonics부터 수능까지 이어지는 영어 성장 로드맵</div>
    </div>
  </div>
</body>
</html>
