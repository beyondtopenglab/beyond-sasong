     카카오톡은 상대 경로를 읽지 못하고 전체 주소를 요구한다.
     주소가 바뀌면(도메인을 붙이면) 이 두 줄도 함께 고쳐야 한다. -->

<meta property="og:description" content="결과가 다른 영어 · Phonics부터 수능까지 이어지는 영어 성장 로드맵">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<style>
  /* ---------------------------------------------------------------------
     연분홍 바탕 위에 흰 카드 하나. 빨강은 로고 파일에서 뽑은 값(#DB0106)이고,
     중성색은 순회색이 아니라 그 빨강 쪽으로 살짝 기울여 골랐다.

     세로를 아낀다 — 휴대폰 한 화면에 전부 들어와야 하므로 머리를 키우지 않고
     버튼 사이 간격도 좁게 잡았다.
     --------------------------------------------------------------------- */
  :root {
    --brand:      #DB0106;
    --brand-ink:  #C00105;   /* 밝은 면 위의 글자·아이콘용 */
    --tint:       #FCE7E8;
    --tint-line:  #F6D5D7;

    --ground:     #FDF2F3;   /* 카드 뒤 연분홍 */
    --card:       #FFFFFF;
    --line:       #F1E3E3;
    --ink:        #1A1213;
    --ink-2:      #4C3B3C;
    --muted:      #8A7476;

    /* 주 버튼은 «브랜드 면» 이라 테마를 타지 않는다. 어두운 테마에서 빨강을
       밝히면 흰 글자와의 대비가 3.2:1 로 떨어진다. */
    --cta-bg:       #DB0106;
    --cta-bg-press: #AE0105;
    --cta-fg:       #FFF7F7;

    --shadow-card: 0 1px 2px rgba(26,18,19,.04), 0 18px 40px -24px rgba(219,1,6,.22);
    --shadow-row:  0 1px 2px rgba(26,18,19,.05);
  }

  /* 밝은 테마 하나로 고정한다. 보는 사람 휴대폰이 어두운 모드여도 이 모습
     그대로 나온다 — 색이 전부 위에 적혀 있고 body 가 배경을 직접 칠하므로
     바깥 테마를 따라가지 않는다. */

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    /* flex-start 가 없으면 카드가 세로로 늘어나 화면을 꽉 채운다 */
    align-items: flex-start;
    padding: clamp(10px, 2.5vh, 22px) 12px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 26px;
    box-shadow: var(--shadow-card);
    /* 화면이 낮을수록 알아서 조여진다 — 휴대폰 한 화면에 다 들어와야 하므로 */
    padding: clamp(18px, 3vh, 26px) 18px calc(clamp(16px, 2.4vh, 22px) + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: clamp(13px, 2.2vh, 20px);
  }

  /* --------------------------------------------------------------- 머리 */
  .mast {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 5px;
  }

  /* 로고 파일 자체가 빨간 면이라 원형으로 자르면 그대로 빨간 원이 된다 */
  .mark {
    width: clamp(56px, 8vh, 72px);
    height: clamp(56px, 8vh, 72px);
    border-radius: 50%;
    display: block;
    margin-bottom: clamp(4px, .8vh, 9px);
    box-shadow: 0 6px 18px -6px rgba(219,1,6,.5);
  }

  h1 {
    margin: 0;
    font-family: "Gowun Batang", serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-wrap: balance;
  }

  .claim {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--brand-ink);
    letter-spacing: -.01em;
  }
  .claim em {
    font-family: Fraunces, serif;
    font-style: italic;
    font-weight: 500;
  }

  .sub {
    margin: 0;
    font-size: 12.5px;
    font-weight: 300;
    color: var(--muted);
    text-wrap: balance;
  }

  /* -------------------------------------------------------------- 버튼
     형태로 우선순위를 나눈다 — 꽉 찬 면 → 연한 면 → 흰 면. */
  nav {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 9px);
  }

  nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    /* 46px 아래로는 내려가지 않는다 — 손가락으로 누를 수 있어야 한다 */
    min-height: clamp(46px, 6.2vh, 54px);
    padding: 10px 15px;
    border-radius: 15px;
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -.015em;
    transition: transform .12s ease, background-color .18s ease, border-color .18s ease;
  }

  nav a span { flex: 1; }
  nav a svg { flex: none; }
  nav a:active { transform: translateY(1px); }

  .primary {
    background: var(--cta-bg);
    color: var(--cta-fg);
    box-shadow: 0 8px 20px -10px rgba(219,1,6,.75);
  }
  .primary:hover { background: var(--cta-bg-press); }

  .secondary {
    background: var(--tint);
    color: var(--brand-ink);
    border: 1px solid var(--tint-line);
  }
  .secondary:hover { border-color: var(--brand-ink); }

  .plain {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-row);
  }
  .plain:hover { background: var(--tint); border-color: var(--tint-line); }
  .plain svg:first-child { color: var(--brand-ink); }
  .chev { color: var(--muted); }
  .primary .chev { color: rgba(255,247,247,.75); }
  .secondary .chev { color: var(--brand-ink); opacity: .7; }

  /* --------------------------------------------------------------- 꼬리 */
  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    text-align: center;
  }

  .social { display: flex; gap: 8px; }

  .social a {
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--tint);
    color: var(--brand-ink);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: background-color .15s ease;
  }
  .social a:hover { background: var(--tint-line); }

  .legal {
    margin: 0;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  a:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }

  /* 아주 낮은 화면에서는 글자까지 한 단계 줄인다 */
  @media (max-height: 700px) {
    h1 { font-size: 19px; }
    .claim { font-size: 13.5px; }
    .sub { font-size: 12px; }
    nav a { font-size: 15px; }
  }
</style>
</head>

  </nav>
