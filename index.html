<style>
  /* ---------------------------------------------------------------------
     색 — 브랜드 레드는 로고 파일에서 그대로 뽑은 값이다 (#DB0106).
     중성색은 순회색이 아니라 이 빨강 쪽으로 살짝 기울여 골랐다.
     --------------------------------------------------------------------- */
  :root {
    --brand:        #DB0106;
    --brand-deep:   #7C0510;
    --brand-ink:    #C00105;
    --brand-tint:   #FCE9E9;
    --brand-line:   #F2CFD0;

    /* 주 버튼은 «브랜드 면» 이라 테마를 타지 않는다.
       어두운 테마에서 빨강을 밝히면 흰 글자와의 대비가 3.2:1 로 떨어진다. */
    --cta-bg:       #DB0106;
    --cta-bg-press: #AE0105;
    --cta-fg:       #FFF7F7;

    --ground:       #FBF7F6;
    --surface:      #FFFFFF;
    --line:         #ECE3E2;
    --ink:          #1A1213;
    --ink-2:        #4A3A3B;
    --muted:        #7D6A6B;

    --on-brand:     #FFF7F7;
    --on-brand-dim: #F4BFC0;

    --radius: 14px;
    --shadow: 0 1px 2px rgba(26,18,19,.05), 0 10px 28px -14px rgba(219,1,6,.28);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* 밝힌 빨강은 «바탕 위의 글자·아이콘» 에만 쓴다. 버튼 면에는 쓰지 않는다. */
      --brand:        #FF4B50;
      --brand-deep:   #5C060C;
      --brand-ink:    #FF7A7E;
      --brand-tint:   #2D1516;
      --brand-line:   #4B2022;

      --ground:       #141011;
      --surface:      #1E1718;
      --line:         #2E2425;
      --ink:          #F6EEEE;
      --ink-2:        #D6C4C4;
      --muted:        #9C8687;

      --on-brand:     #FFF4F4;
      --on-brand-dim: #E4A5A6;

      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 452px;
    margin-inline: auto;
    padding-bottom: max(56px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* --------------------------------------------------------------- 머리 */
  .mast {
    background:
      radial-gradient(120% 90% at 50% -18%, rgba(255,90,95,.55) 0%, transparent 60%),
      linear-gradient(168deg, var(--brand) 0%, var(--brand-deep) 100%);
    color: var(--on-brand);
    padding: calc(46px + env(safe-area-inset-top)) 28px 34px;
    border-radius: 0 0 26px 26px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .mark {
    width: 62px;
    height: 62px;
    border-radius: 17px;
    display: block;
    background: var(--on-brand);
    padding: 4px;
    box-shadow: 0 6px 20px -8px rgba(0,0,0,.45);
  }

  .wordmark { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .wordmark b {
    font-family: Fraunces, "Gowun Batang", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(36px, 11.5vw, 44px);
    line-height: .96;
    letter-spacing: -.018em;
  }

  .wordmark i {
    font-style: normal;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .42em;
    text-indent: .42em;
    color: var(--on-brand-dim);
  }

  .campus {
    margin-top: 6px;
    font-family: "Gowun Batang", serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .tagline { display: flex; flex-direction: column; gap: 6px; }
  .tagline p { margin: 0; text-wrap: balance; }

  .claim {
    font-family: "Gowun Batang", serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .claim em { font-family: Fraunces, serif; font-weight: 500; font-style: italic; }

  .sub { font-size: 13px; font-weight: 300; color: var(--on-brand-dim); }

  /* 로드맵 레일 — «Phonics부터 수능까지» 를 그림으로 옮긴 것.
     페이지에서 유일하게 움직이는 부분이다. */
  .rail { width: 100%; display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }

  .rail-label {
    font-size: 9.5px; font-weight: 600;
    letter-spacing: .3em; text-indent: .3em;
    color: var(--on-brand-dim);
  }

  .rail-track {
    position: relative; height: 9px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .rail-track::before {
    content: ""; position: absolute; inset-inline: 3px; height: 1px;
    background: var(--on-brand-dim); opacity: .5;
    transform: scaleX(0); transform-origin: left center;
    animation: draw .85s cubic-bezier(.22,1,.36,1) .15s forwards;
  }

  .rail-track b {
    position: relative; width: 7px; height: 7px; border-radius: 50%;
    background: var(--on-brand-dim); opacity: 0;
    animation: pop .4s cubic-bezier(.22,1,.36,1) forwards;
  }
  .rail-track b:first-child, .rail-track b:last-child {
    width: 9px; height: 9px; background: var(--on-brand);
    box-shadow: 0 0 0 4px rgba(255,247,247,.16);
  }
  .rail-track b:nth-child(1) { animation-delay: .20s; }
  .rail-track b:nth-child(2) { animation-delay: .38s; }
  .rail-track b:nth-child(3) { animation-delay: .52s; }
  .rail-track b:nth-child(4) { animation-delay: .66s; }
  .rail-track b:nth-child(5) { animation-delay: .84s; }

  .rail-ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; }
  .rail-ends span:first-child { font-family: Fraunces, serif; font-weight: 600; }

  @keyframes draw { to { transform: scaleX(1); } }
  @keyframes pop  { to { opacity: 1; } }

  /* ------------------------------------------------------------- 행동
     형태로 우선순위를 나눈다. 똑같은 알약 여섯 개를 쌓지 않는다. */
  .actions { padding-inline: 20px; display: flex; flex-direction: column; gap: 10px; }

  .cta {
    display: flex; align-items: center; gap: 12px;
    min-height: 60px; padding: 14px 18px;
    border-radius: var(--radius); text-decoration: none;
    font-size: 16px; font-weight: 600; letter-spacing: -.012em;
    transition: transform .12s ease, background-color .18s ease, border-color .18s ease;
  }
  .cta svg { flex: none; }
  .cta strong { flex: 1; font-weight: inherit; }
  .cta:active { transform: translateY(1px); }

  .cta-primary { background: var(--cta-bg); color: var(--cta-fg); box-shadow: var(--shadow); }
  .cta-primary:hover { background: var(--cta-bg-press); }

  .cta-secondary {
    background: var(--brand-tint); color: var(--brand-ink);
    border: 1px solid var(--brand-line);
  }
  .cta-secondary:hover { border-color: var(--brand-ink); }

  /* 보조 링크 — 알약 대신 실선으로 나눈 목록 */
  .links {
    margin-inline: 20px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .links a {
    display: flex; align-items: center; gap: 13px;
    min-height: 56px; padding: 12px 16px;
    color: var(--ink); text-decoration: none;
    font-size: 15px; font-weight: 500; letter-spacing: -.012em;
    border-top: 1px solid var(--line);
    transition: background-color .15s ease;
  }
  .links a:first-child { border-top: 0; }
  .links a:hover { background: var(--brand-tint); }
  .links a span { flex: 1; }
  .links a svg { flex: none; color: var(--brand-ink); }
  .links a .chev { color: var(--muted); }

  /* --------------------------------------------------------------- 꼬리 */
  footer {
    padding-inline: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center;
  }

  .latin {
    margin: 0; font-family: Fraunces, serif;
    font-size: 13px; font-weight: 500; color: var(--muted);
  }

  .social { display: flex; gap: 8px; }
  .social a {
    padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink-2);
    text-decoration: none; font-size: 13px; font-weight: 500;
    transition: border-color .15s ease, color .15s ease;
  }
  .social a:hover { border-color: var(--brand-ink); color: var(--brand-ink); }

  .legal {
    margin: 0; font-size: 11.5px; font-weight: 300;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }

  a:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 3px; border-radius: 8px; }
  .mast a:focus-visible { outline-color: var(--on-brand); }

  @media (prefers-reduced-motion: reduce) {
    .rail-track::before { transform: scaleX(1); animation: none; }
    .rail-track b { opacity: 1; animation: none; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
